<!doctype html>
<html lang="ko" data-type="software">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff"><meta name="page-type" content="software"><meta name="site-kind" content="software">
  <title>RouteFlow · 하루 여행 코스</title>
  <meta name="description" content="부산, 서울, 도쿄의 하루 여행을 지도에서 둘러보고 나만의 일정으로 만들어 보세요.">
  <link rel="canonical" href="https://routeflow.example/">
  <meta property="og:type" content="website"><meta property="og:title" content="RouteFlow · 하루 여행 코스">
  <meta property="og:description" content="부산, 서울, 도쿄의 하루 여행을 지도에서 둘러보고 나만의 일정으로 만들어 보세요.">
  <meta property="og:url" content="https://routeflow.example/"><meta property="og:image" content="https://routeflow.example/assets/og-routeflow.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="assets/noto-sans-kr-course.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="css/examples.css">
  <script defer src="config.js"></script><script defer src="runtime-config.js"></script><script type="module" src="js/home.js"></script>
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="top"><div class="shell top-inner">
  <a class="brand" href="./"><img src="assets/favicon.svg" alt="" width="33" height="33">RouteFlow</a>
  <nav class="actions" aria-label="내 여행"><button data-action="import"><i data-icon="upload"></i>내 엑셀 가져오기</button><button data-action="new"><i data-icon="plus"></i>빈 일정 만들기</button><button data-action="account" class="login">로그인</button></nav>
</div></header>
<main id="main" class="shell">
  <section class="intro" aria-labelledby="courseTitle">
    <div class="city-row"><p class="collection"><i data-icon="compass"></i> 여행 코스 둘러보기</p>
    <nav class="cities" aria-label="예시 도시"><button data-city="busan" aria-pressed="true">부산</button><button data-city="seoul" aria-pressed="false">서울</button><button data-city="tokyo" aria-pressed="false">도쿄</button></nav></div>
    <h1 id="courseTitle">부산, 바다를 따라</h1>
    <p id="description">동백섬 숲길에서 청사포 등대까지, 해안선을 따라 동쪽으로 걷는 하루.</p>
    <div class="meta"><span><i data-icon="pin"></i><span id="area">해운대 · 청사포</span></span><span><i data-icon="flag"></i>장소 4곳</span><span><i data-icon="clock"></i><span id="duration">이동 약 70분</span></span></div>
  </section>
  <p id="homeStatus" role="status" hidden></p>
  <div class="views" aria-label="보기 전환"><button data-view="list" aria-pressed="true"><i data-icon="list"></i>일정 보기</button><button data-view="map" aria-pressed="false"><i data-icon="map"></i>지도 보기</button></div>
  <div class="workspace" id="workspace" data-mobile-view="list">
    <section class="schedule" aria-labelledby="scheduleTitle">
      <div class="panel-heading"><h2 id="scheduleTitle"><i data-icon="list"></i> 하루 일정</h2><span id="timeRange">09:30 — 15:00</span></div>
      <ol id="stops"></ol>
    </section>
    <section class="map-panel" aria-labelledby="mapTitle">
      <div class="panel-heading"><h2 id="mapTitle"><i data-icon="map"></i> 동선 지도</h2><span class="map-mode" id="mapMode">예시 약도</span></div>
      <div class="map-canvas">
        <div id="schematic"></div><div id="liveMap" hidden></div>
        <button id="switchMap" class="switch-map" hidden>Google 지도 열기</button>
      </div>
      <div class="map-detail" aria-live="polite"><span id="selectionNumber">01</span><div><h3 id="selectionTitle">동백섬</h3><p id="selectionMemo"></p></div></div>
    </section>
  </div>
  <div class="course-foot"><p><i data-icon="info"></i><span>이동 시간은 예시 추정치예요. <span class="updated">2026.11.22 기준</span></span></p><button class="primary" data-action="copy">이 코스로 내 여행 만들기 <i data-icon="arrow"></i></button></div>
  <noscript>도시 예시와 일정을 보려면 브라우저에서 자바스크립트를 켜 주세요.</noscript>
</main>
<footer><div class="shell"><span class="footer-brand">RouteFlow</span><nav aria-label="서비스 안내"><a href="terms.html">이용약관</a><a href="privacy.html">개인정보처리방침</a></nav></div></footer>
<dialog id="authDialog" aria-labelledby="authTitle" aria-describedby="authMessage">
  <img src="assets/favicon.svg" width="38" height="38" alt=""><h2 id="authTitle">로그인하고 시작하세요</h2>
  <p id="authMessage"></p><button class="primary" id="authContinue">Google로 계속하기 <i data-icon="arrow"></i></button>
  <button id="authCancel">예시로 돌아가기</button>
</dialog>
</body></html>
