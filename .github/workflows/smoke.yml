name: Smoke test

on:
  push:
    branches: [feat/map-first-ui]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check js/app.js
      - name: Start app and check served files
        run: |
          npm start -- --no-open > /tmp/routeflow-server.log 2>&1 &
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:8080';
          for (let attempt = 0; attempt < 40; attempt++) {
            try {
              const response = await fetch(base);
              if (response.ok) break;
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 250));
          }
          for (const [path, type] of [
            ['/', 'text/html'],
            ['/js/app.js', 'text/javascript'],
            ['/vendor/xlsx.full.min.js', 'text/javascript'],
            ['/' + encodeURIComponent('지도_양식.xlsx'), 'spreadsheetml'],
          ]) {
            const response = await fetch(base + path);
            assert.equal(response.status, 200, path);
            assert.match(response.headers.get('content-type'), new RegExp(type), path);
            assert((await response.arrayBuffer()).byteLength > 0, path);
          }
          JS
