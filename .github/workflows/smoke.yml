name: Production checks

on:
  push:
    branches: [main, work, 'rebuild/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_URL: http://127.0.0.1:8097
      ACCOUNT_OUT: /tmp/routeflow-ci/accounts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Scan Git history for secrets (redacted)
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          mkdir -p /tmp/routeflow-ci
          /tmp/gitleaks git --redact --report-format json --report-path /tmp/routeflow-ci/secrets.json --log-opts='--all' .
      - name: Check source, dependencies, units and release
        env:
          SITE_URL: ${{ vars.STAGING_SITE_URL }}
          PUBLIC_GOOGLE_MAPS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_PUBLIC_MAPS_KEY || '' }}
        run: |
          git ls-files '*.js' '*.cjs' ':!:vendor/*' | while IFS= read -r file; do node --check "$file"; done
          npm audit --audit-level=moderate
          npm test
          npm run build
          npm run check:release
      - name: Install isolated test browser
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Start production artifact
        run: |
          PORT=8097 HOST=127.0.0.1 npm run start:production > /tmp/routeflow-ci/server.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS "$APP_URL/healthz"; then exit 0; fi
            sleep 0.25
          done
          exit 1
      - name: Member journeys on the production artifact (mock identity provider)
        run: |
          node tests/browser/account-workspace.cjs
          node tests/browser/editor-entry.cjs
          node tests/browser/public-examples.cjs
      - name: Editor regressions including all 78 negative cases
        env:
          REGRESSION_OUT: /tmp/routeflow-ci/editor
          REGRESSION_ONLY: production-stability,budget-travel,day-revision,traveler-journey,travel-order,travel-drag,travel-workspace,travel-safety,workspace-board,workspace-layout,map-controls,repeated-places,negative-78
        run: node tests/browser/rebuild-regressions.cjs
      - name: Lighthouse lab measurement (keyless first visit)
        env:
          CHROME_PATH: ${{ env.CHROMIUM_PATH }}
        run: npx lighthouse "$APP_URL" --chrome-flags='--headless --no-sandbox' --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/routeflow-ci/lighthouse.json --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-check-evidence
          path: /tmp/routeflow-ci
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          include-hidden-files: true
          retention-days: 14
      - name: Package the checked Node service for private staging
        run: |
          tar -czf "${RUNNER_TEMP}/routeflow-service.tgz" dist backend js/examples.js js/travel-store.js tools/http-server.js tools/public-assets.js production-server.js package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: routeflow-service
          path: ${{ runner.temp }}/routeflow-service.tgz
          retention-days: 14
